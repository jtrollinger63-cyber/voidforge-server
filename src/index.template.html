<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#04060c">
<title>Voidforge Racing</title>
<style>
:root{--bg:#04060c;--glass:rgba(10,14,26,.72);--glass2:rgba(255,255,255,.06);--line:rgba(255,255,255,.14);--cy:#25e6ff;--mg:#ff3d71;--gold:#ffb703;--ok:#6dffb0;--bad:#ff5a6a;--ink:#eef3ff;--mute:#8fa3c8;--font:"Trebuchet MS","Segoe UI",system-ui,-apple-system,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--font);user-select:none;-webkit-user-select:none;touch-action:none}
canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none}
[hidden]{display:none!important}
button{font-family:inherit}
b{font-weight:800}
kbd{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);border-bottom-width:2px;border-radius:5px;padding:0 6px;font:700 11px/17px var(--font);margin:0 1px}

/* ---------------------------------------------------------------- screens */
.screen{position:fixed;inset:0;display:flex;opacity:0;pointer-events:none;transition:opacity .35s ease;overflow:hidden;z-index:10}
.screen.on{opacity:1;pointer-events:auto}
.scrim{position:absolute;inset:0;background:linear-gradient(90deg,rgba(3,5,12,.94) 0%,rgba(3,5,12,.7) 38%,rgba(3,5,12,.05) 75%);pointer-events:none}
.scrim.full{background:radial-gradient(ellipse at 50% 40%,rgba(3,5,12,.55),rgba(3,5,12,.92))}
.scrim.bottom{background:linear-gradient(0deg,rgba(3,5,12,.9),rgba(3,5,12,0) 45%)}
.wrap{position:relative;display:flex;flex-direction:column;width:100%;height:100%;padding:clamp(14px,3.2vw,44px);gap:14px}
.title-xl{font-size:clamp(40px,9vw,128px);font-weight:900;font-style:italic;letter-spacing:.01em;line-height:.9;text-shadow:0 6px 0 rgba(255,61,113,.9),0 0 60px rgba(37,230,255,.35)}
.title-xl span{color:var(--cy)}
.sub{font-weight:800;letter-spacing:.6em;color:var(--gold);font-style:italic;font-size:clamp(11px,1.6vw,22px);margin-top:10px}
h2.hd{margin:0;font-size:clamp(22px,3.6vw,46px);font-style:italic;font-weight:900;letter-spacing:.02em}
h2.hd small{display:block;font-size:.34em;letter-spacing:.35em;color:var(--cy);font-style:normal;margin-bottom:4px}
.tag{font-size:12px;letter-spacing:.22em;color:var(--mute);font-weight:800;text-transform:uppercase}

/* title */
#s-title .wrap{justify-content:center;align-items:flex-start;padding-left:clamp(20px,7vw,120px)}
.press{margin-top:38px;font-weight:800;letter-spacing:.35em;font-size:clamp(11px,1.5vw,18px);color:#fff;animation:blink 1.6s ease-in-out infinite}
@keyframes blink{50%{opacity:.25}}
.ver{position:absolute;right:20px;bottom:14px;color:var(--mute);font-size:11px;letter-spacing:.2em}

/* main menu */
.menu-list{display:flex;flex-direction:column;gap:8px;width:min(460px,90vw)}
.mbtn{white-space:nowrap;position:relative;display:flex;align-items:center;gap:14px;border:0;color:var(--ink);background:linear-gradient(90deg,rgba(255,255,255,.1),rgba(255,255,255,.03));padding:14px 22px;font:900 clamp(15px,2vw,22px) var(--font);font-style:italic;letter-spacing:.06em;text-align:left;cursor:pointer;clip-path:polygon(0 0,100% 0,calc(100% - 14px) 100%,0 100%);transition:transform .12s,background .12s;text-transform:uppercase}
.mbtn small{margin-left:auto;font-style:normal;font-weight:700;letter-spacing:.14em;color:var(--mute);font-size:11px}
.mbtn:hover,.mbtn:focus-visible{outline:none;transform:translateX(10px);background:linear-gradient(90deg,var(--cy),rgba(37,230,255,.15));color:#021218}
.mbtn:hover small{color:#05303a}
.mbtn .ic{width:22px;text-align:center;opacity:.85}
.mbtn.locked{opacity:.45}
.profile{position:absolute;right:clamp(14px,3vw,44px);top:clamp(14px,3vw,34px);text-align:right;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.chip{background:var(--glass);border:1px solid var(--line);border-radius:12px;padding:8px 14px;backdrop-filter:blur(8px);font-weight:800}
.chip b{color:var(--gold)}
.lvl{width:min(250px,60vw)}
.lvl .bar{height:8px;border-radius:5px;background:rgba(255,255,255,.14);overflow:hidden;margin-top:6px}
.lvl .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--cy),var(--mg));transition:width .6s}
.hintbar{position:absolute;left:clamp(14px,3.2vw,44px);bottom:14px;color:var(--mute);font-size:12px;letter-spacing:.06em}
.carcard{position:absolute;right:clamp(14px,4vw,60px);bottom:clamp(20px,5vh,60px);text-align:right}
.carcard .nm{font-size:clamp(20px,3vw,40px);font-weight:900;font-style:italic}
.carcard .cl{color:var(--cy);letter-spacing:.3em;font-size:12px;font-weight:800;text-transform:uppercase}

/* panels, buttons */
.panel{background:var(--glass);border:1px solid var(--line);border-radius:16px;backdrop-filter:blur(10px);padding:clamp(12px,1.8vw,22px)}
.btn{border:0;cursor:pointer;color:#02141a;background:linear-gradient(90deg,var(--cy),#7df1ff);font:900 clamp(14px,1.7vw,20px) var(--font);font-style:italic;letter-spacing:.12em;padding:14px 30px;text-transform:uppercase;clip-path:polygon(0 0,100% 0,calc(100% - 14px) 100%,0 100%);transition:transform .1s,filter .1s}
.btn:hover{filter:brightness(1.12);transform:translateY(-2px)}
.btn:active{transform:translateY(1px)}
.btn.alt{background:rgba(255,255,255,.12);color:var(--ink)}
.btn.gold{background:linear-gradient(90deg,var(--gold),#ffd76a)}
.btn.red{background:linear-gradient(90deg,var(--mg),#ff7a95);color:#fff}
.btn[disabled]{filter:grayscale(1);opacity:.45;pointer-events:none}
.btn.sm{padding:9px 18px;font-size:13px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.seg{display:inline-flex;background:var(--glass2);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;color:var(--mute);font:800 13px var(--font);padding:8px 14px;border-radius:8px;cursor:pointer;letter-spacing:.05em}
.seg button.on{background:var(--cy);color:#021218}
.field{display:flex;flex-direction:column;gap:6px;min-width:130px}
.field>label,.lab{font-size:11px;letter-spacing:.22em;color:var(--mute);font-weight:800;text-transform:uppercase}
.slider{display:flex;align-items:center;gap:12px}
input[type=range]{-webkit-appearance:none;appearance:none;height:6px;border-radius:4px;background:rgba(255,255,255,.18);outline:none;width:min(240px,50vw)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:var(--cy);border:3px solid #021218;cursor:pointer;box-shadow:0 0 12px rgba(37,230,255,.7)}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--cy);border:3px solid #021218;cursor:pointer}
.val{min-width:44px;text-align:right;font-weight:800;font-variant-numeric:tabular-nums;color:var(--cy)}
.toggle{width:52px;height:28px;border-radius:15px;background:rgba(255,255,255,.18);position:relative;cursor:pointer;border:0;transition:background .15s}
.toggle::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .15s}
.toggle.on{background:var(--cy)}.toggle.on::after{left:27px}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px solid var(--line)}
.setrow:last-child{border-bottom:0}
.setrow .d{color:var(--mute);font-size:12px;margin-top:2px;max-width:340px}

/* setup (track cards) */
.cards{display:flex;gap:12px;overflow-x:auto;padding:8px 4px 14px;scroll-snap-type:x proximity;touch-action:pan-x}
.tcard{position:relative;flex:0 0 clamp(190px,24vw,300px);border:2px solid transparent;border-radius:16px;overflow:hidden;cursor:pointer;background:var(--glass);scroll-snap-align:start;transition:transform .15s,border-color .15s;text-align:left;color:inherit;font:inherit;padding:0}
.tcard:hover{transform:translateY(-4px)}
.tcard.on{border-color:var(--cy);box-shadow:0 0 30px rgba(37,230,255,.25)}
.tcard .thumb{height:clamp(110px,15vw,170px);position:relative;display:flex;align-items:center;justify-content:center}
.tcard canvas{width:100%;height:100%;display:block}
.tcard .meta{padding:10px 14px 14px}
.tcard .nm{font-weight:900;font-style:italic;font-size:17px}
.tcard .ds{color:var(--mute);font-size:12px;line-height:1.4;margin-top:4px;min-height:34px}
.tcard .st{display:flex;gap:10px;margin-top:8px;font-size:11px;font-weight:800;letter-spacing:.1em;color:var(--cy)}
.tcard .lock{position:absolute;inset:0;background:rgba(3,5,12,.78);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-weight:900;letter-spacing:.2em;color:var(--gold)}
.tcard .lock span{font-size:30px}
.stars{color:var(--gold);letter-spacing:2px}
.stat{display:grid;grid-template-columns:78px 1fr 34px;align-items:center;gap:10px;font-size:12px;font-weight:800;letter-spacing:.14em;color:var(--mute)}
.stat .b{height:8px;border-radius:4px;background:rgba(255,255,255,.12);overflow:hidden}
.stat .b i{display:block;height:100%;background:linear-gradient(90deg,var(--cy),#7df1ff);transition:width .5s}
.stat .b i.up{background:linear-gradient(90deg,var(--gold),#ffe08a)}
.stat span:last-child{text-align:right;color:var(--ink)}

/* garage */
#s-garage .wrap{flex-direction:row;align-items:stretch}
.glist{display:flex;flex-direction:column;gap:8px;width:clamp(180px,22vw,290px);overflow-y:auto;padding-right:6px;touch-action:pan-y}
.gcar{border:1px solid var(--line);border-radius:12px;background:var(--glass);color:inherit;text-align:left;padding:10px 14px;cursor:pointer;transition:transform .12s,border-color .12s;font:inherit;position:relative}
.gcar:hover{transform:translateX(6px)}
.gcar.on{border-color:var(--cy);background:linear-gradient(90deg,rgba(37,230,255,.2),var(--glass))}
.gcar .n{font-weight:900;font-style:italic;font-size:15px}.gcar .c{font-size:11px;letter-spacing:.2em;color:var(--mute);text-transform:uppercase;margin-top:2px}
.gcar .pi{position:absolute;right:12px;top:10px;font-weight:900;color:var(--cy);font-style:italic}
.gcar .tagc{position:absolute;right:12px;bottom:9px;font-size:11px;font-weight:800;letter-spacing:.12em;color:var(--gold)}
.gcar.lockedc{opacity:.62}
.gpanel{width:clamp(250px,30vw,400px);display:flex;flex-direction:column;gap:12px;overflow-y:auto;touch-action:pan-y}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tabs button{flex:1;border:0;background:var(--glass2);color:var(--mute);font:800 12px var(--font);letter-spacing:.14em;padding:10px 6px;cursor:pointer;border-radius:8px;text-transform:uppercase}
.tabs button.on{background:var(--cy);color:#021218}
.swatches{display:flex;flex-wrap:wrap;gap:9px}
.sw{width:36px;height:36px;border-radius:50%;border:3px solid rgba(255,255,255,.2);cursor:pointer;padding:0;transition:transform .12s}
.sw:hover{transform:scale(1.12)}.sw.on{border-color:#fff;box-shadow:0 0 0 3px var(--cy)}
.opt{border:1px solid var(--line);background:var(--glass2);color:var(--ink);border-radius:10px;padding:10px 14px;cursor:pointer;font:800 13px var(--font);letter-spacing:.06em}
.opt.on{border-color:var(--cy);background:rgba(37,230,255,.18)}
.upg{display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.upg .n{font-weight:900;font-style:italic}.upg .d{grid-column:1;color:var(--mute);font-size:11px}
.pips{display:flex;gap:5px;grid-column:1}.pips i{width:26px;height:7px;border-radius:3px;background:rgba(255,255,255,.16)}.pips i.on{background:var(--gold)}
.gfoot{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:flex-end;padding:clamp(14px,3vw,40px);pointer-events:none}
.gfoot>*{pointer-events:auto}
.gname{position:absolute;left:50%;top:clamp(14px,3vw,34px);transform:translateX(-50%);text-align:center;pointer-events:none}
.gname .nm{font-size:clamp(24px,4.4vw,56px);font-weight:900;font-style:italic;text-shadow:0 4px 20px rgba(0,0,0,.6)}
.gname .cl{color:var(--cy);letter-spacing:.4em;font-size:12px;font-weight:800}

/* loading */
#s-loading{background:radial-gradient(ellipse at 30% 30%,#0e1630,#04060c);align-items:center;justify-content:center}
.ldwrap{width:min(720px,88vw)}
.ldname{font-size:clamp(28px,6vw,72px);font-weight:900;font-style:italic;line-height:1}
.ldbar{margin-top:26px;height:8px;border-radius:5px;background:rgba(255,255,255,.12);overflow:hidden}
.ldbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cy),var(--mg));transition:width .25s}
.ldtip{margin-top:14px;color:var(--mute);font-size:13px;letter-spacing:.08em;min-height:20px}

/* pause / results */
.center{align-items:center;justify-content:center}
.dlg{width:min(560px,92vw);display:flex;flex-direction:column;gap:12px;text-align:center}
.dlg .mbtn{justify-content:center;clip-path:none;border-radius:10px}
#s-results .wrap{align-items:center;justify-content:center;overflow-y:auto;touch-action:pan-y}
.res{width:min(1020px,96vw);display:grid;grid-template-columns:1.25fr 1fr;gap:16px}
@media (max-width:820px){.res{grid-template-columns:1fr}}
table.tbl{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:clamp(12px,1.4vw,15px)}
table.tbl th{font-size:10px;letter-spacing:.2em;color:var(--mute);text-align:left;padding:6px 8px;font-weight:800}
table.tbl td{padding:8px;border-top:1px solid var(--line)}
table.tbl tr.me td{background:rgba(37,230,255,.16);font-weight:800}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px;vertical-align:middle}
.big-pos{font-size:clamp(46px,9vw,110px);font-weight:900;font-style:italic;line-height:.9;color:var(--gold);text-shadow:0 4px 0 rgba(0,0,0,.4)}
.rline{display:flex;justify-content:space-between;padding:7px 0;border-top:1px solid var(--line);font-weight:700}
.rline b{color:var(--gold);font-variant-numeric:tabular-nums}
.rtotal{display:flex;justify-content:space-between;font-size:22px;font-weight:900;font-style:italic;margin-top:8px}
.popup{position:fixed;left:50%;top:18%;transform:translate(-50%,-30px);background:linear-gradient(90deg,var(--gold),#ffe08a);color:#201500;font-weight:900;font-style:italic;padding:14px 28px;border-radius:12px;opacity:0;transition:all .4s;z-index:60;letter-spacing:.08em;text-transform:uppercase;box-shadow:0 10px 40px rgba(0,0,0,.5)}
.popup.show{opacity:1;transform:translate(-50%,0)}
.replaybar{position:absolute;left:50%;bottom:26px;transform:translateX(-50%);display:flex;gap:10px;align-items:center;background:var(--glass);border:1px solid var(--line);border-radius:14px;padding:10px 16px;backdrop-filter:blur(8px);width:min(720px,94vw)}
.replaybar input{flex:1;width:auto}

/* toasts */
#toasts{position:fixed;left:50%;top:clamp(70px,12vh,120px);transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;z-index:50;pointer-events:none}
.toast{background:var(--glass);border:1px solid var(--line);border-radius:10px;padding:8px 18px;font-weight:800;letter-spacing:.08em;animation:toast 2.2s ease forwards;backdrop-filter:blur(8px)}
@keyframes toast{0%{opacity:0;transform:translateY(-8px)}10%,80%{opacity:1;transform:none}100%{opacity:0}}

/* ---------------------------------------------------------------- HUD */
#hud{position:fixed;inset:0;pointer-events:none;z-index:5;font-variant-numeric:tabular-nums;text-shadow:0 2px 6px rgba(0,0,0,.6)}
.hud-vignette{position:absolute;inset:0;opacity:0;background:radial-gradient(ellipse at center,rgba(37,230,255,0) 55%,rgba(37,230,255,.25) 100%);transition:opacity .12s}
.hud-hit{position:absolute;inset:0;opacity:0;background:radial-gradient(ellipse at center,rgba(255,61,113,0) 50%,rgba(255,61,113,.5) 100%);transition:opacity .15s}
.hud-tl{position:absolute;left:clamp(10px,2vw,30px);top:clamp(10px,2vw,26px);display:flex;flex-direction:column;gap:6px}
.hud-pos{display:flex;align-items:baseline;gap:6px;font-style:italic;font-weight:900;background:linear-gradient(90deg,rgba(6,9,18,.78),rgba(6,9,18,0));padding:6px 34px 6px 14px;border-left:5px solid var(--gold)}
.hud-pos .p{color:var(--gold);font-size:clamp(14px,2vw,24px)}.hud-pos b{font-size:clamp(40px,6.5vw,86px);line-height:.9}.hud-pos i{font-size:clamp(13px,1.8vw,22px);color:var(--mute);font-style:normal}
.hud-lap{font-weight:900;font-style:italic;font-size:clamp(14px,1.8vw,24px);letter-spacing:.1em;background:linear-gradient(90deg,rgba(6,9,18,.7),rgba(6,9,18,0));padding:4px 30px 4px 14px;border-left:5px solid var(--cy)}
.hud-lap span{color:var(--mute)}
.hud-tc{position:absolute;left:50%;top:clamp(8px,1.6vw,22px);transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:4px;min-width:280px}
.hud-tc small,.hud-timer small{display:block;font-size:10px;letter-spacing:.22em;color:var(--mute);font-weight:800}
.t-main{background:rgba(6,9,18,.72);border-bottom:3px solid var(--cy);padding:4px 22px;text-align:center;clip-path:polygon(8px 0,calc(100% - 8px) 0,100% 100%,0 100%)}
.t-main b{font-size:clamp(20px,3vw,38px);font-style:italic;font-weight:900}
.t-row{display:flex;gap:16px;background:rgba(6,9,18,.6);padding:4px 16px;border-radius:0 0 10px 10px}
.t-row div{text-align:center}.t-row b{font-size:clamp(12px,1.5vw,17px)}.best{color:var(--ok)}
.t-cp{display:flex;gap:5px}.t-cp i{width:20px;height:5px;background:rgba(255,255,255,.2);border-radius:2px}.t-cp i.on{background:var(--cy)}.t-cp i.next{background:var(--gold);animation:blink .8s infinite}
.t-split{font-weight:900;font-style:italic;font-size:clamp(16px,2.2vw,28px);opacity:0;transform:translateY(-6px);transition:all .25s;height:30px}
.t-split.show{opacity:1;transform:none}.t-split.ahead{color:var(--ok)}.t-split.behind{color:var(--bad)}
.hud-tr{position:absolute;right:clamp(10px,2vw,30px);top:clamp(10px,2vw,26px);width:clamp(130px,17vw,230px);aspect-ratio:1}
.hud-tr canvas{width:100%;height:100%;display:block}.map-n{position:absolute;left:50%;top:2px;transform:translateX(-50%);font-size:11px;font-weight:900;color:var(--mg)}
.hud-br{position:absolute;right:clamp(8px,1.8vw,28px);bottom:clamp(8px,1.8vw,24px);width:clamp(190px,25vw,330px)}
.hud-br canvas{width:100%;display:block;filter:drop-shadow(0 6px 18px rgba(0,0,0,.6))}
.nitro{margin-top:-6px;display:flex;align-items:center;gap:10px;font-size:11px;font-weight:900;letter-spacing:.22em;color:var(--mute)}
.nitro .bar{flex:1;height:10px;border-radius:5px;background:rgba(255,255,255,.14);overflow:hidden;transform:skewX(-20deg)}
.nitro .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#0aa2ff,var(--cy))}
.nitro.full .bar{box-shadow:0 0 16px var(--cy)}.nitro.on .bar i{background:linear-gradient(90deg,#fff,var(--cy))}.nitro.on span{color:#fff}
.hud-feed{position:absolute;left:clamp(10px,2vw,30px);top:34%;display:flex;flex-direction:column;gap:5px}
.hud-feed .m{font-weight:900;font-style:italic;letter-spacing:.06em;padding:5px 16px 5px 12px;background:linear-gradient(90deg,rgba(6,9,18,.78),rgba(6,9,18,0));border-left:4px solid var(--cy);font-size:clamp(12px,1.6vw,19px);animation:feed .35s ease}
.hud-feed .m.good{border-color:var(--ok);color:var(--ok)}.hud-feed .m.gold{border-color:var(--gold);color:var(--gold)}.hud-feed .m.bad{border-color:var(--bad);color:var(--bad)}
@keyframes feed{from{transform:translateX(-30px);opacity:0}}
.hud-drift,.hud-timer{display:none}
.hud-drift{position:absolute;left:50%;bottom:18%;transform:translateX(-50%);text-align:center;opacity:.55;transition:opacity .2s}
.hud-drift.active{opacity:1}.hud-drift .d-label{font-size:11px;letter-spacing:.4em;color:var(--mute);font-weight:900}
.hud-drift .d-chain{font-size:clamp(34px,6vw,76px);font-weight:900;font-style:italic;line-height:1;color:var(--gold)}.hud-drift.flash .d-chain{color:var(--ok);transform:scale(1.15)}
.hud-drift .d-mult{font-weight:900;font-style:italic;color:var(--mg);font-size:clamp(14px,2vw,26px)}
.d-bar{height:5px;width:220px;margin:6px auto;background:rgba(255,255,255,.15);border-radius:3px;overflow:hidden}.d-bar i{display:block;height:100%;background:var(--gold)}
.d-bank{font-size:13px;letter-spacing:.14em;color:var(--mute)}.d-bank b{color:#fff}
.hud-timer{position:absolute;left:50%;top:clamp(8px,1.6vw,22px);transform:translateX(-50%);text-align:center;background:rgba(6,9,18,.72);padding:4px 26px;border-bottom:3px solid var(--mg)}
.hud-timer b{font-size:clamp(24px,4vw,50px);font-style:italic;font-weight:900}.hud-timer.low b{color:var(--bad);animation:blink .6s infinite}
.hud-center{position:absolute;left:0;right:0;top:30%;text-align:center;font-size:clamp(60px,15vw,200px);font-weight:900;font-style:italic;color:#fff;opacity:0;text-shadow:0 8px 0 #c71f4a,0 0 60px rgba(37,230,255,.6)}
.hud-center.pop{animation:pop 1s ease-out}.hud-center.go{color:var(--ok);text-shadow:0 8px 0 #0b6a3a,0 0 70px rgba(109,255,176,.7)}.hud-center.small{font-size:clamp(34px,8vw,100px)}
@keyframes pop{0%{opacity:0;transform:scale(2)}15%{opacity:1;transform:scale(1)}75%{opacity:1}100%{opacity:0;transform:scale(.9)}}
.hud-warn{position:absolute;left:0;right:0;top:20%;text-align:center;font-weight:900;font-style:italic;font-size:clamp(28px,6vw,72px);color:var(--gold);opacity:0;text-shadow:0 4px 0 #8a3d00}.hud-warn.show{opacity:1;animation:blink .5s infinite}
.hud-lights{position:absolute;left:50%;top:19%;transform:translateX(-50%);display:flex;gap:14px;opacity:0;transition:opacity .2s}.hud-lights.show{opacity:1}
.hud-lights i{width:clamp(30px,5vw,60px);height:clamp(30px,5vw,60px);border-radius:50%;background:#2a0d12;border:3px solid #000;box-shadow:inset 0 0 12px #000}.hud-lights i.on{background:#ff2a2a;box-shadow:0 0 30px #ff2a2a}.hud-lights i.go{background:#46ff8e;box-shadow:0 0 36px #46ff8e}
.hud-hint{position:absolute;left:clamp(10px,2vw,30px);bottom:clamp(10px,2vw,24px);font-size:12px;color:var(--mute);transition:opacity 1.2s;background:rgba(6,9,18,.6);padding:6px 12px;border-radius:8px}
.hud-fps{position:absolute;left:8px;top:8px;font-size:11px;color:#9fe;font-weight:800}
#hud[data-mode=free] .hud-pos,#hud[data-mode=trial] .hud-pos{display:none}

/* touch */
#touch{position:fixed;inset:0;z-index:6;pointer-events:none;touch-action:none}
.tb{position:absolute;pointer-events:auto;display:flex;align-items:center;justify-content:center;border-radius:22px;background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.3);color:#fff;font:900 20px var(--font);touch-action:none;backdrop-filter:blur(3px);user-select:none}
.tb.down{background:rgba(37,230,255,.38);border-color:var(--cy)}
#tL,#tR{bottom:calc(24px + env(safe-area-inset-bottom));width:calc(clamp(74px,18vw,110px)*var(--ts,1));height:calc(clamp(74px,18vw,110px)*var(--ts,1))}
#tL{left:calc(14px + env(safe-area-inset-left))}#tR{left:calc(28px + clamp(74px,18vw,110px)*var(--ts,1) + env(safe-area-inset-left))}
#tGas{right:calc(14px + env(safe-area-inset-right));bottom:calc(24px + env(safe-area-inset-bottom));width:calc(clamp(86px,21vw,128px)*var(--ts,1));height:calc(clamp(110px,26vw,160px)*var(--ts,1));background:rgba(109,255,176,.2);border-color:rgba(109,255,176,.7)}
#tBrake{right:calc(26px + clamp(86px,21vw,128px)*var(--ts,1) + env(safe-area-inset-right));bottom:calc(24px + env(safe-area-inset-bottom));width:calc(clamp(70px,17vw,100px)*var(--ts,1));height:calc(clamp(70px,17vw,100px)*var(--ts,1));background:rgba(255,61,113,.2);border-color:rgba(255,90,130,.7)}
#tNitro{right:calc(18px + env(safe-area-inset-right));bottom:calc(46px + clamp(110px,26vw,160px)*var(--ts,1) + env(safe-area-inset-bottom));width:64px;height:64px;border-radius:50%;font-size:12px;background:rgba(37,230,255,.18);border-color:rgba(37,230,255,.8)}
#tHand{right:calc(34px + clamp(86px,21vw,128px)*var(--ts,1) + env(safe-area-inset-right));bottom:calc(46px + clamp(70px,17vw,100px)*var(--ts,1) + env(safe-area-inset-bottom));width:60px;height:60px;border-radius:50%;font-size:11px}
#tCam,#tPause{top:calc(clamp(150px,22vw,240px) + env(safe-area-inset-top));width:48px;height:48px;border-radius:50%;font-size:17px}
#tCam{right:calc(14px + env(safe-area-inset-right))}#tPause{right:calc(70px + env(safe-area-inset-right))}
@media (max-width:760px){
  .hud-br{width:clamp(150px,40vw,210px);bottom:calc(clamp(120px,30vw,200px) + 14px)}.hud-hint{display:none}.hud-feed{top:44%}
  .hud-tc{min-width:0;transform:translateX(-50%) scale(.82);transform-origin:top center}
  .hud-tr{width:clamp(96px,26vw,130px)}
  .hud-lap,.hud-pos{transform:scale(.9);transform-origin:left top}
  #s-garage .wrap{flex-direction:column}.glist{flex-direction:row;width:100%;overflow-x:auto;overflow-y:hidden}.gcar{min-width:170px}.gpanel{width:100%;max-height:40vh}
  .profile{position:static;align-items:flex-start;margin-bottom:6px}
}
body.touch-ui .hud-br{right:auto;left:50%;transform:translateX(-50%);width:clamp(130px,21vw,200px);bottom:calc(6px + env(safe-area-inset-bottom))}
body.touch-ui .hud-hint{display:none}
@media (max-height:520px){
  .hud-hint,.t-row{display:none}
  #tGas{width:calc(92px*var(--ts,1));height:calc(128px*var(--ts,1))}
  #tBrake{right:calc(116px*var(--ts,1) + env(safe-area-inset-right));bottom:calc(20px + env(safe-area-inset-bottom));width:calc(76px*var(--ts,1));height:calc(76px*var(--ts,1))}
  #tNitro{right:calc(124px*var(--ts,1) + env(safe-area-inset-right));bottom:calc(108px*var(--ts,1) + env(safe-area-inset-bottom));width:56px;height:56px}
  #tHand{right:calc(206px*var(--ts,1) + env(safe-area-inset-right));bottom:calc(22px + env(safe-area-inset-bottom));width:60px;height:60px}
  #tCam,#tPause{top:calc(12px + env(safe-area-inset-top));width:42px;height:42px}
  #tCam{right:calc(clamp(130px,17vw,230px) + 44px + env(safe-area-inset-right))}#tPause{right:calc(clamp(130px,17vw,230px) + 94px + env(safe-area-inset-right))}
  #tL,#tR{width:calc(86px*var(--ts,1));height:calc(86px*var(--ts,1))}#tR{left:calc(112px*var(--ts,1) + env(safe-area-inset-left))}
}
</style>
</head>

  <div id="tL" class="tb">◀</div><div id="tR" class="tb">▶</div>

  <div id="tNitro" class="tb">NITRO</div><div id="tHand" class="tb">DRIFT</div>
  <div id="tCam" class="tb">⟳</div><div id="tPause" class="tb">❚❚</div>
</div>
<div id="ui"></div>
<div id="toasts"></div>
