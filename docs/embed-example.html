<!doctype html>
<!-- Copy-paste example: a responsive 16:9 embed of Voidforge Racing.
     Host index.html on any static HTTPS host first, then point `src` at it.
     In Google Sites: Insert -> Embed -> "By URL" (paste the HTTPS URL), or "Embed code" (paste the <div> below). -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Voidforge Racing embed</title>
<style>body{margin:0;background:#04060c}.game{position:relative;width:100%;max-width:1280px;margin:0 auto;aspect-ratio:16/9}.game iframe{position:absolute;inset:0;width:100%;height:100%;border:0}</style></head>
<body>
<div class="game">
  <iframe src="https://YOUR-HOST/voidforge-racing/index.html" title="Voidforge Racing"
          allow="autoplay; fullscreen; gamepad; accelerometer; gyroscope" allowfullscreen loading="lazy"></iframe>
</div>
</body></html>
